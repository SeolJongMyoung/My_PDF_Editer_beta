name: Build and Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Single EXE on Windows
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. Install Dependencies (requirements.txt & PyInstaller)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: 4. Sync Tag Version & Build Single Executable via build.py
        id: build_step
        shell: pwsh
        run: |
          # Git 태그(예: refs/tags/v1.1.0)에서 버전 번호 추출 및 src/__version__.py 동기화 검증
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match "^v(\d+)\.(\d+)\.(\d+)") {
            $maj = $Matches[1]
            $min = $Matches[2]
            $pat = $Matches[3]
            $verPath = "src/__version__.py"
            $content = Get-Content $verPath -Raw -Encoding UTF8
            $content = $content -replace "VERSION_MAJOR:\s*int\s*=\s*\d+", "VERSION_MAJOR: int = $maj"
            $content = $content -replace "VERSION_MINOR:\s*int\s*=\s*\d+", "VERSION_MINOR: int = $min"
            $content = $content -replace "VERSION_PATCH:\s*int\s*=\s*\d+", "VERSION_PATCH: int = $pat"
            Set-Content -Path $verPath -Value $content -Encoding UTF8
          }

          # build.py 실행 -> releases/v{version}/QuickPDFEditor_v{version}.exe 생성
          python build.py

          # 생성된 EXE 및 릴리스 노트 파일 경로 확인
          $exeFile = Get-ChildItem -Path "releases" -Recurse -Filter "QuickPDFEditor_v*.exe" | Select-Object -First 1
          if (-not $exeFile) {
            Write-Error "빌드된 QuickPDFEditor_v*.exe 파일을 찾을 수 없습니다."
            exit 1
          }
          $noteFile = Get-ChildItem -Path "releases" -Recurse -Filter "RELEASE_NOTES_v*.txt" | Select-Object -First 1
          if ($noteFile) {
            Copy-Item $noteFile.FullName -Destination "release_body.txt" -Force
          }
          Write-Host "Built EXE: $($exeFile.FullName)"

      - name: 5. Upload Build Artifact (Workflow Run Archive)
        uses: actions/upload-artifact@v4
        with:
          name: QuickPDFEditor-Windows-EXE
          path: |
            releases/**/QuickPDFEditor_v*.exe
            releases/**/RELEASE_NOTES_v*.txt
          if-no-files-found: error

      - name: 6. Create GitHub Release and Upload EXE Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "QuickPDFEditor ${{ github.ref_name }}"
          body_path: release_body.txt
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            releases/**/QuickPDFEditor_v*.exe
            releases/**/RELEASE_NOTES_v*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
